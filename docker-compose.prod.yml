services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    # No published port - only the app container talks to db, over the
    # default network Compose creates for this project. Never expose
    # Postgres to the host on a production server.

  app:
    build:
      context: .
      dockerfile: Dockerfile.prod
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env.production
    ports:
      - "3002:4000"
    volumes:
      - uploads:/app/uploads
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "DomainName=registar.kset.org"

volumes:
  pgdata:
  uploads:
