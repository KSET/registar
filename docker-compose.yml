services:
  db:
    image: postgres:16
    ports:
      # 5432 i 5433 su već zauzeti (lokalni Postgres / drugi kontejneri), pa
      # bazu izlažemo na 5434. Interni pristup (server -> db:5432) ide preko
      # Docker mreže i nije pogođen.
      - "5434:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 5

  server:
    build:
      context: .
      dockerfile: Dockerfile
    command: sh -c "cd server && npx nodemon src/index.js"
    working_dir: /app
    ports:
      - "4000:4000"
    volumes:
      - ./server:/app/server
      - /app/server/node_modules
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env

  client:
    build: ./client
    ports:
      - "3002:3000"
    volumes:
      - ./client/src:/app/src
    env_file:
      - .env

volumes:
  pgdata:
